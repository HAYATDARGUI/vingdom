spring:
  application:
    name: user-auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/vingdom_users
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.vengdom: DEBUG

jwt:
  secret: ${JWT_SECRET:JMJSu0Hscj4rVwLC9GHMBxTyzwS7DBssYpB9PwivBIg=}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}