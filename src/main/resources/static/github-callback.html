<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub OAuth callback - Vingdom Auth Service</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>GitHub callback</h1>

  <h2>Authorization code from GitHub</h2>
  <pre id="codeBox">(reading from URL...)</pre>

  <h2>Response from POST /auth/oauth/github</h2>
  <pre id="responseBox">(waiting)</pre>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      document.getElementById('codeBox').textContent = 'GitHub returned an error: ' + error;
      document.getElementById('responseBox').textContent = '(nothing to exchange)';
    } else if (!code) {
      document.getElementById('codeBox').textContent = '(no code in URL - did you land here directly instead of via github-test.html?)';
    } else {
      document.getElementById('codeBox').textContent = code;

      fetch('/auth/oauth/github', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      })
        .then(async (res) => {
          const body = await res.text();
          document.getElementById('responseBox').textContent = 'HTTP ' + res.status + '\n' + body;
        })
        .catch((err) => {
          document.getElementById('responseBox').textContent = 'Request failed: ' + err;
        });
    }
  </script>
</body>
</html>
